services:
  db:
    image: postgres:16-alpine
    container_name: recoverai_db
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai
      POSTGRES_DB: recoverai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
